worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'trace=$http_x_trace_id rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 110M;     # Evidence upload: 100MB + overhead

    # ─── Rate Limiting Zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=ai_heavy:10m  rate=20r/m;
    limit_req_zone $binary_remote_addr zone=evidence:10m  rate=10r/m;

    # ─── Upstreams — NestJS Core Services ────────────────────────────────────
    upstream auth_service       { server auth-service:3001; }
    upstream case_service       { server case-service:3002; }
    upstream people_service     { server people-service:3003; }
    upstream unit_service       { server unit-service:3004; }
    upstream evidence_service   { server evidence-service:3005; }
    upstream alert_service      { server alert-service:3006; }
    upstream audit_service      { server audit-service:3007; }
    upstream task_service       { server task-service:3008; }
    upstream digest_service     { server digest-service:3009; }
    upstream admin_service      { server admin-service:3010; }
    upstream performance_service { server performance-service:3011; }
    upstream report_service     { server report-service:3012; }

    # ─── Upstreams — FastAPI AI Services ─────────────────────────────────────
    upstream nlq_service        { server nl-query-engine:8001; }
    upstream embedding_service  { server embedding-service:8002; }
    upstream graph_service      { server graph-orchestrator:8004; }
    upstream xai_service        { server explainability-service:8005; }
    upstream face_service       { server face-similarity-service:8006; }
    upstream cctv_service       { server cctv-metadata-service:8007; }
    upstream vehicle_service    { server vehicle-reid-service:8008; }
    upstream forecast_service   { server trend-forecast-service:8010; }

    server {
        listen 80;
        server_name _;

        # ─── Security headers ─────────────────────────────────────────────
        add_header X-Content-Type-Options    nosniff;
        add_header X-Frame-Options           DENY;
        add_header X-XSS-Protection          "1; mode=block";
        add_header Referrer-Policy           strict-origin-when-cross-origin;

        # ─── CORS (for dev) ───────────────────────────────────────────────
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Trace-Id" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ─── 1. Auth Service ──────────────────────────────────────────────
        location ~ ^/api/v1/auth {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://auth_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ─── 2. Unit Service ──────────────────────────────────────────────
        location ~ ^/api/v1/units {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://unit_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 3. Case Service ──────────────────────────────────────────────
        location ~ ^/api/v1/cases {
            limit_req zone=general burst=30 nodelay;
            proxy_pass         http://case_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── Tasks (standalone PATCH /tasks/:id) ──────────────────────────
        location ~ ^/api/v1/tasks {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://task_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 4. People Service ────────────────────────────────────────────
        location ~ ^/api/v1/people {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://people_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 5. Acts Service (proxied through case service) ───────────────
        location ~ ^/api/v1/acts {
            limit_req zone=general burst=10 nodelay;
            proxy_pass         http://case_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 6. Evidence Upload (strict rate limit) ───────────────────────
        location ~ ^/api/v1/cases/.*/evidence$ {
            limit_req zone=evidence burst=5 nodelay;
            client_max_body_size 110M;
            proxy_pass         http://evidence_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/v1/evidence {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://evidence_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 7. Alerts ────────────────────────────────────────────────────
        location ~ ^/api/v1/alerts {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://alert_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 8. NL Query / AI (strict rate limit) ─────────────────────────
        location ~ ^/api/v1/ai {
            limit_req zone=ai_heavy burst=5 nodelay;
            proxy_pass         http://nlq_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 30s;
        }

        # ─── 9. Similarity / Graph / Forecast / Digest ────────────────────
        location ~ ^/api/v1/graph {
            limit_req zone=ai_heavy burst=10 nodelay;
            proxy_pass         http://graph_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/forecast {
            limit_req zone=ai_heavy burst=10 nodelay;
            proxy_pass         http://forecast_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location ~ ^/api/v1/digest {
            limit_req zone=general burst=10 nodelay;
            proxy_pass         http://digest_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 10. Intel Extension Modules ──────────────────────────────────
        location ~ ^/api/v1/intel/face {
            limit_req zone=ai_heavy burst=5 nodelay;
            proxy_pass         http://face_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            client_max_body_size 20M;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/intel/cctv {
            limit_req zone=ai_heavy burst=10 nodelay;
            proxy_pass         http://cctv_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location ~ ^/api/v1/intel/vehicle {
            limit_req zone=ai_heavy burst=10 nodelay;
            proxy_pass         http://vehicle_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 11. Reports ──────────────────────────────────────────────────
        location ~ ^/api/v1/reports {
            limit_req zone=general burst=10 nodelay;
            proxy_pass         http://report_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 12. Performance ──────────────────────────────────────────────
        location ~ ^/api/v1/performance {
            limit_req zone=general burst=10 nodelay;
            proxy_pass         http://performance_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── 13. Admin ────────────────────────────────────────────────────
        location ~ ^/api/v1/admin {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://admin_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── Explainability traces (proxied to XAI service) ───────────────
        location ~ ^/api/v1/ai/trace {
            limit_req zone=general burst=20 nodelay;
            proxy_pass         http://xai_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ─── Health check ─────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","service":"drishti-gateway"}';
            add_header Content-Type application/json;
        }

        # ─── 404 catch-all ────────────────────────────────────────────────
        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"Route not found"}}';
            add_header Content-Type application/json;
        }
    }
}
