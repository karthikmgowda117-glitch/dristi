[tool.poetry]
name = "drishti-ai-services"
version = "1.0.0"
description = "Project Drishti AI/ML FastAPI Services"
authors = ["Drishti Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"

# Database
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
alembic = "^1.13.1"

# Redis
redis = {extras = ["asyncio"], version = "^5.0.3"}

# Neo4j
neo4j = "^5.18.0"

# ML / AI
sentence-transformers = "^2.6.1"
numpy = "^1.26.4"
scikit-learn = "^1.4.1"
pgvector = "^0.2.5"
httpx = "^0.27.0"

# STT (Voice)
openai-whisper = "^20231117"

# Forecasting
statsmodels = "^0.14.1"
prophet = "^1.1.5"

# JWT validation
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

# Utilities
python-multipart = "^0.0.9"
aiofiles = "^23.2.1"
minio = "^7.2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
