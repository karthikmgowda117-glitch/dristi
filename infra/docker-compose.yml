version: "3.9"

x-common-env: &common-env
  NODE_ENV: development
  DATABASE_URL: postgresql://drishti:drishti_secret@postgres:5432/drishti
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: drishti_minio
  MINIO_SECRET_KEY: drishti_minio_secret
  MINIO_BUCKET: drishti-evidence
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: drishti_neo4j
  JWT_SECRET: drishti_jwt_super_secret_hackathon_2026
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  OLLAMA_BASE_URL: http://ollama:11434

x-py-common-env: &py-common-env
  DATABASE_URL: postgresql+asyncpg://drishti:drishti_secret@postgres:5432/drishti
  REDIS_URL: redis://redis:6379
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: drishti_neo4j
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: llama3.2
  JWT_SECRET: drishti_jwt_super_secret_hackathon_2026
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: drishti_minio
  MINIO_SECRET_KEY: drishti_minio_secret
  MINIO_BUCKET: drishti-evidence

services:
  # ─── Data Layer ──────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drishti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.17-community
    container_name: drishti_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/drishti_neo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: drishti_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: drishti_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drishti_minio
      MINIO_ROOT_PASSWORD: drishti_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: drishti_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull model on startup
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.2 && wait"]

  # ─── API Gateway ─────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.25-alpine
    container_name: drishti_gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - case-service
      - people-service
      - unit-service
      - evidence-service
      - alert-service
      - audit-service
      - admin-service
      - performance-service
      - report-service
      - nl-query-engine
      - embedding-service
      - anomaly-engine
      - graph-orchestrator

  # ─── NestJS Core Services ─────────────────────────────────────────────────
  auth-service:
    build:
      context: ./core-services
      dockerfile: apps/auth-service/Dockerfile
    container_name: drishti_auth
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  case-service:
    build:
      context: ./core-services
      dockerfile: apps/case-service/Dockerfile
    container_name: drishti_case
