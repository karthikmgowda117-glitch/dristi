      <<: *common-env
      PORT: 3012
    ports:
      - "3012:3012"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── FastAPI AI Services ──────────────────────────────────────────────────
